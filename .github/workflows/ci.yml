
name: DevSecOps CI

on:
  push:
  workflow_dispatch:

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        run: bandit -ll -ii -r . -f json -o bandit-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-findings
          path: bandit-report.json


  image_scan:
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -f Dockerfile -t mytestapp:latest .

      - name: Docker Scout Scan
        uses: docker/scout-action@v1.15.1
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          command: quickview,cves
          image: local://mytestapp:latest
          only-severities: critical,high
          sarif-file: scout-report.sarif
          exit-code: true

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-findings
          path: scout-report.sarif


  dast_scan:
    name: DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [sast_scan, image_scan]   # runs after them...
    if: ${{ always() }}              # ...but still runs even when they fail (expected by design)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build PyGoat image from this repository (Task 3 bonus)
        run: docker build -f Dockerfile -t pygoat-ci:latest .

      - name: Deploy the self-built PyGoat image
        # Host networking so the app is reachable at localhost:8000 from the ZAP container.
        # The image bakes in only the code (its CMD just runs gunicorn), so we run DB
        # migrations before starting gunicorn, otherwise DB-backed pages return 500.
        run: |
          docker run -d --name pygoat --network host pygoat-ci:latest \
            sh -c "python manage.py migrate --noinput && \
                   exec gunicorn --bind 0.0.0.0:8000 --workers 4 --worker-class gthread --threads 4 --timeout 600 pygoat.wsgi"

      - name: Wait for PyGoat to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:8000/ >/dev/null 2>&1; then
              echo "PyGoat is up"; exit 0
            fi
            echo "waiting for PyGoat... ($i/30)"; sleep 5
          done
          echo "PyGoat did not start in time"; docker logs pygoat; exit 1

      - name: OWASP ZAP baseline scan
        run: |
          mkdir -p zap-report && chmod 777 zap-report
          set +e
          docker run --network host -v "${{ github.workspace }}/zap-report:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8000 \
            -r zap_report.html -J zap_report.json -a
          rc=$?
          set -e
          echo "ZAP exit code: $rc"
          # ZAP baseline exit codes: 0 = clean, 1 = FAIL-level findings, 2 = WARN-level findings.
          # All three mean the scan RAN (findings are expected for a vulnerable app).
          # Anything higher means ZAP itself could not run the scan -> fail the job.
          if [ "$rc" -gt 2 ]; then
            echo "::error::ZAP did not complete successfully (exit $rc)"
            exit 1
          fi
          # Safety net: a successful scan must have produced a non-empty report.
          if [ ! -s zap-report/zap_report.json ]; then
            echo "::error::ZAP report is missing or empty"
            exit 1
          fi
          echo "ZAP scan completed (exit $rc); findings are recorded in the artifact."

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-findings
          path: zap-report/
